<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taman Bunga Senja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: full-bleed illustrated lakeside garden; title chip top-left; glass control dock bottom.
   Single committed look (dusk garden), so colors are explicit and the page is dark by design. */
:root{
  --night:#0e0a22; --ink:#f8f0e8; --ink2:#d9cfe4;
  --glass:rgba(24,18,48,.58); --glass-line:rgba(255,255,255,.18);
  --accent:#ff8db3; --accent-ink:#2b1035;
  --font-d:'Instrument Serif',Georgia,'Times New Roman',serif;
  --font-b:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sw:4;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ink);
  font:400 14px/1.4 var(--font-b);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#scene,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:2}
#scene{cursor:cell;touch-action:manipulation;user-select:none;-webkit-user-select:none;z-index:1}
#charA,#charB{cursor:pointer}
.nopt{pointer-events:none}

header.top{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-block:12px 0}
.brand,.dock{
  background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.brand{border-radius:16px;padding:10px 14px;max-width:min(430px,72vw)}
.brand h1{margin:0;font:italic 400 clamp(28px,5.4vw,40px)/1 var(--font-d);letter-spacing:.2px;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--ink2);font-size:12.5px;transition:opacity .8s}
.brand p.fade{opacity:0;height:0;margin:0;overflow:hidden}

.btn{
  font:inherit;color:var(--ink);background:rgba(255,255,255,.09);
  border:1px solid var(--glass-line);border-radius:999px;padding:6px 12px;min-height:36px;
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.btn:hover{background:rgba(255,255,255,.18)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#togglePanel{background:var(--glass);flex:none}

.fab{
  position:fixed;z-index:9;right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);font-weight:600;border-color:transparent;
  min-height:46px;padding:8px 18px;box-shadow:0 8px 22px rgba(0,0,0,.38);
}
.fab:hover{background:#ffa3c4}
.fab[aria-expanded="true"]{background:#fff8f0}
.dock{
  position:fixed;z-index:8;right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(70px + env(safe-area-inset-bottom,0px));
  width:min(360px,calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  max-height:calc(100% - 150px - env(safe-area-inset-bottom,0px));overflow:auto;
  border-radius:20px;padding:14px;display:grid;gap:14px;box-sizing:border-box;
  animation:bpop .25s cubic-bezier(.3,1.4,.5,1);transform-origin:100% 100%;
}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);min-width:100%}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
.rng{display:inline-flex;align-items:center;gap:8px;color:var(--ink2)}
input[type=range]{accent-color:var(--accent);width:130px;max-width:38vw}
.count{color:var(--ink2);font-size:12.5px;font-variant-numeric:tabular-nums}

.bubble{
  position:fixed;z-index:7;max-width:min(250px,72vw);padding:7px 12px 8px;border-radius:14px;
  background:#fff8f0;color:#2b2140;font-size:12.5px;line-height:1.38;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.28);--tx:50%;
}
.bubble::after{
  content:"";position:absolute;top:100%;left:var(--tx);margin-left:-7px;
  border:7px solid transparent;border-top-color:#fff8f0;
}
.bubble .nm{font-weight:600;font-size:10.5px;letter-spacing:.2px;color:#b0457a;margin-bottom:1px}
.bubble.pop{animation:bpop .35s cubic-bezier(.3,1.5,.5,1)}
.toast{
  position:fixed;z-index:7;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);
  background:var(--glass);border:1px solid var(--glass-line);padding:8px 14px;border-radius:999px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:13px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- SVG animation ---------- */
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--d,3.6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
#planted .pop{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.3,1.6,.5,1) backwards}
.stem{fill:none;stroke:#3d8a3a;stroke-width:2.4;stroke-linecap:round}
.lf{fill:#4aa043}.lf2{fill:#3b8e37}
.tuft{fill:none;stroke:#2f7a34;stroke-width:1.6;stroke-linecap:round;opacity:.75}
.cLeaf{fill:var(--leaf)}.cLeafD{fill:var(--leafD)}.cLeafL{fill:var(--leafL)}
.cTree{fill:var(--tree)}
.canopy{transform-box:fill-box;transform-origin:50% 0%;animation:tsway 8s ease-in-out infinite}
.cloud{fill:var(--cloud);opacity:.85}
#clouds{animation:drift 90s ease-in-out infinite alternate}
.star{fill:#fff;animation:twinkle 3s ease-in-out infinite}
.shim{fill:#fff;opacity:.22;animation:shim 5s ease-in-out infinite}
.gl{fill:var(--sunC);animation:shim 2.6s ease-in-out infinite}
.rip{fill:none;stroke:#fff;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:rip 2.2s ease-out forwards}
.swan{animation:glide 46s ease-in-out infinite alternate}
.swan.s2{animation-duration:58s;animation-direction:alternate-reverse}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.5s ease-in-out infinite}
.headA{transform-box:fill-box;transform-origin:50% 100%;animation:leanA 11s ease-in-out infinite}
.headB{transform-box:fill-box;transform-origin:50% 100%;animation:leanB 11s ease-in-out infinite}
.hairA{transform-box:fill-box;transform-origin:50% 0%;animation:hair 5s ease-in-out infinite}
.lamp{fill:#ffe5a8}
.post{fill:var(--wood);filter:brightness(.82)}
.br{stroke:var(--mortar);stroke-width:.7}

@keyframes sway{0%,100%{transform:rotate(calc(var(--sw) * -1deg))}50%{transform:rotate(calc(var(--sw) * 1deg))}}
@keyframes tsway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.7deg)}}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(60px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shim{0%,100%{opacity:.08;transform:translateX(-6px)}50%{opacity:.4;transform:translateX(6px)}}
@keyframes rip{from{transform:scale(.15);opacity:.95}to{transform:scale(1.8);opacity:0}}
@keyframes glide{from{transform:translateX(-60px)}to{transform:translateX(230px)}}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.2px) scaleY(1.008)}}
@keyframes leanA{0%,35%,100%{transform:rotate(0)}55%,80%{transform:rotate(4deg)}}
@keyframes leanB{0%,35%,100%{transform:rotate(0)}55%,80%{transform:rotate(-4deg)}}
@keyframes hair{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
@keyframes lopen{from{transform:rotate(0deg) scale(.42,.85)}to{transform:rotate(var(--a)) scale(1)}}
@keyframes lbud{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes lfade{from{opacity:0}to{opacity:1}}
.lp{animation:lopen 1.4s cubic-bezier(.35,1.25,.5,1) 2s both}
.lbud{transform-box:fill-box;transform-origin:50% 100%;animation:lbud .5s ease-out 2s both}
.lst{animation:lfade .6s ease-out 2.9s both}
@keyframes sail{from{transform:translateX(-140px)}to{transform:translateX(1620px)}}
@keyframes row{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(14deg)}}
@keyframes wakeA{0%,100%{opacity:.5}50%{opacity:1}}
.sailing{animation:sail 75s linear -18s infinite}
.oar{animation:row 2.6s ease-in-out infinite}
.oarFar{animation-delay:-.1s}
.wake{animation:wakeA 2.6s ease-in-out infinite}
@keyframes moonPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}
.moonHalo{transform-box:fill-box;transform-origin:50% 50%;animation:moonPulse 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(2.5px) rotate(1.4deg)}}
.boat{transform-box:fill-box;transform-origin:50% 80%;animation:bob 5.5s ease-in-out infinite}
@keyframes grow{from{transform:scale(0)}}
@keyframes bpop{from{transform:scale(.7);opacity:0}}
.brsw{transform-box:view-box;animation:bsw 9s ease-in-out infinite}
.brsw .brsw{animation:none}
.swing{transform-box:fill-box;transform-origin:50% 0%;animation:swingA 5s ease-in-out infinite}
.bird{transform-box:fill-box;transform-origin:50% 100%;animation:hop 7s ease-in-out infinite}
.btail{transform-box:fill-box;transform-origin:0% 50%;animation:flick 7s ease-in-out infinite}
@keyframes bsw{0%,100%{transform:rotate(-.4deg)}50%{transform:rotate(.5deg)}}
@keyframes swingA{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes hop{0%,80%,100%{transform:translateY(0)}84%{transform:translateY(-3px)}88%{transform:translateY(0)}92%{transform:translateY(-2px)}96%{transform:translateY(0)}}
@keyframes flick{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-12deg)}90%{transform:rotate(4deg)}}
.zz{fill:#fff8f0;font-family:var(--font-d);font-style:italic;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:zz 4.2s ease-out infinite;paint-order:stroke;stroke:rgba(60,30,80,.35);stroke-width:2px}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(16px,-34px) scale(1.15)}}

@media (max-width:560px){
  .lbl{min-width:100%}
  .brand p{display:none}
  .dock{padding:9px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- intro screen ---------- */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(120% 90% at 50% 110%,#ffb48a 0%,#e48aac 28%,#6b5fb8 62%,#1c1640 100%);
  transition:opacity 1.2s ease,visibility 1.2s;overflow:hidden}
#intro.gone{opacity:0;visibility:hidden}
#intro::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 8%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 72% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 86% 26%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 45% 22%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 60% 6%,#fff 50%,transparent 51%);
  opacity:.7;animation:twinkle 4s ease-in-out infinite}
.intro-card{position:relative;max-width:560px;text-align:center;color:#fff8f2;animation:introIn 1.6s cubic-bezier(.2,.8,.2,1) both}
.intro-card .orn{font:italic 400 18px/1 var(--font-d);letter-spacing:6px;opacity:.75;margin-bottom:22px}
.intro-card p{margin:0;font:italic 400 clamp(24px,4.6vw,36px)/1.35 var(--font-d);text-wrap:balance;text-shadow:0 2px 18px rgba(40,10,60,.35)}
.intro-card p + p{margin-top:18px;font-size:clamp(19px,3.4vw,26px);opacity:.92}
#openBtn{margin-top:38px;font:600 15px/1 var(--font-b);letter-spacing:.4px;color:var(--accent-ink);
  background:#ffe4ee;border:0;border-radius:999px;padding:15px 30px;cursor:pointer;
  box-shadow:0 8px 30px rgba(255,141,179,.45),0 0 0 6px rgba(255,255,255,.12);
  transition:transform .25s,box-shadow .25s;animation:introIn 1.6s .6s cubic-bezier(.2,.8,.2,1) both}
#openBtn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,141,179,.6),0 0 0 8px rgba(255,255,255,.16)}
#openBtn:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes introIn{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.intro-card,#openBtn{animation:none}}
</style>
<svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Taman bunga di tepi danau saat senja. Dua sahabat duduk di atas karpet piknik menatap danau sementara seorang nelayan mendayung perahunya, dikelilingi tulip, lily, dan hyacinth. Seekor kucing abu-abu belang tidur nyenyak di dekat mereka.">
<defs>

  </linearGradient>
  <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:var(--grassA)"/><stop offset="1" style="stop-color:var(--grassB)"/>
  </linearGradient>
  <radialGradient id="gSun"><stop offset="0" style="stop-color:var(--sunC);stop-opacity:.95"/><stop offset=".35" style="stop-color:var(--sunC);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--sunC);stop-opacity:0"/></radialGradient>
  <radialGradient id="gMoon"><stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/><stop offset=".25" stop-color="#f3f0ff" stop-opacity=".55"/><stop offset=".6" stop-color="#c9c4ff" stop-opacity=".18"/><stop offset="1" stop-color="#c9c4ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gMoonDisc" cx=".42" cy=".38"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#fbf8ff"/><stop offset="1" stop-color="#e6e1fa"/></radialGradient>

<!-- ============ FAR: sky, sun, moon, clouds, mountains ============ -->

<!-- ============ MID: far tree line, lake, rowboat ============ -->
<g id="gMid">
  <g id="farTrees"></g>
  <rect x="-100" y="452" width="1400" height="125" style="fill:url(#gLake)"/>
  <g id="glitter" transform="translate(860 0)" opacity=".5"></g>
  <g id="shimmer"></g>
  <!-- fisherman rowing his boat across the lake -->
  <g transform="translate(0 500) scale(.82)">
   <g class="sailing">
    <g class="boat">
      <ellipse cx="0" cy="12" rx="78" ry="6" fill="rgba(20,20,60,.22)"/>
      <g class="wake"><path d="M-74 12 C-100 13 -130 11 -170 13 M-70 16 C-96 18 -118 17 -150 19" stroke="rgba(255,255,255,.35)" stroke-width="1.5" fill="none" stroke-linecap="round"/></g>
      <!-- far oar -->
      <g transform="translate(-2 -12)"><g class="oar oarFar"><path d="M0 0 L-34 26" stroke="#5e4028" stroke-width="2.2" stroke-linecap="round"/><path d="M-34 26 l-10 7 l3 3 l10 -6z" fill="#5e4028"/></g></g>
      <!-- fisherman -->
      <g transform="translate(-12 -12)">
        <path d="M-9 0 C-11 -12 -10 -24 -4 -30 L6 -30 C11 -24 12 -12 10 0Z" fill="#3f6e8c" stroke="#2a4c63" stroke-width="1"/>
        <path d="M6 -26 C12 -22 16 -18 20 -14" stroke="#3f6e8c" stroke-width="4.2" stroke-linecap="round" fill="none"/>
        <circle cx="21" cy="-13" r="2.2" fill="#c98e62"/>
        <circle cx="1" cy="-35" r="5.6" fill="#c98e62"/>
        <path d="M-15 -36 L1 -48 L17 -36 C8 -34 -6 -34 -15 -36Z" fill="#e2c27a" stroke="#a8884a" stroke-width="1"/>
        <path d="M-6 -39 L1 -46 M8 -39 L1 -46" stroke="#b89654" stroke-width=".8"/>
      </g>
      <!-- fish basket + rod at the stern -->
      <path d="M-54 -12 l3 -9 h12 l3 9z" fill="#b88a50" stroke="#7a5a30" stroke-width="1"/>
      <path d="M-48 -14 L-84 -44" stroke="#4a3a2a" stroke-width="1.4" stroke-linecap="round"/>

<script>
(function () {
'use strict';
var NS = 'http://www.w3.org/2000/svg';
var $ = function (s) { return document.querySelector(s); };
var svg = $('#scene');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var TAU = Math.PI * 2;

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var R = rng(20261127);
function rr(a, b, r) { r = r || R; return a + (b - a) * r(); }
function pick(arr, r) { r = r || R; return arr[Math.floor(r() * arr.length)]; }
function f(n) { return n.toFixed(1); }

/* ---------------- time-of-day themes ---------------- */
var THEMES = {
  pagi:  { skyTop:'#7fb6e8', skyMid:'#bfe0f0', skyBot:'#ffe9c4', mtnFar:'#8fa9c9', mtnNear:'#6d8fae', tree:'#4f7f66', lakeTop:'#a9d3e8', lakeBot:'#5c97b8', grassA:'#8fd06a', grassB:'#4f9a3f', leaf:'#7cc55a', leafD:'#4a9a3e', leafL:'#b9e68a', trunk:'#6a5238', cloud:'#ffffff', tint:'#ffd9a0', sunC:'#fff3c4', sand:'#e8d7b0', island:'#6dae52', wood:'#7a5636', brick:'#b98a66', mortar:'#8a6448',
           shade:.02, tintOp:.1, sunX:300, sunY:352, sunR:34, sunOp:1, glow:.8, stars:0, moon:0, lamp:0, fly:0 },
  siang: { skyTop:'#3f8fe0', skyMid:'#7cc0f2', skyBot:'#d9f0ff', mtnFar:'#7b9fc8', mtnNear:'#5b86a8', tree:'#3f7f5a', lakeTop:'#7fc4ec', lakeBot:'#2f7fb0', grassA:'#7fd05a', grassB:'#3f9a35', leaf:'#6fc24e', leafD:'#3d9433', leafL:'#aee37a', trunk:'#5e4630', cloud:'#ffffff', tint:'#ffffff', sunC:'#fffbe0', sand:'#efdfb8', island:'#62aa4a', wood:'#7a5636', brick:'#c08e68', mortar:'#8f6a4c',
           shade:0, tintOp:0, sunX:620, sunY:120, sunR:36, sunOp:1, glow:.5, stars:0, moon:0, lamp:0, fly:0 },
  senja: { skyTop:'#6b6fc8', skyMid:'#e79cb8', skyBot:'#ffc58a', mtnFar:'#7c7eb8', mtnNear:'#5a5f9e', tree:'#3f5f6a', lakeTop:'#c9a2c8', lakeBot:'#5a62a6', grassA:'#7bb050', grassB:'#3f7a3a', leaf:'#8fb04a', leafD:'#4f7f36', leafL:'#e0d06a', trunk:'#5a4030', cloud:'#ffc4b0', tint:'#ff9a6a', sunC:'#ffe6a8', sand:'#d8b99a', island:'#5f9a48', wood:'#7a5030', brick:'#b0826a', mortar:'#84604c',
           shade:.1, tintOp:.14, sunX:860, sunY:396, sunR:44, sunOp:1, glow:1, stars:0, moon:0, lamp:.35, fly:0 },
  malam: { skyTop:'#0b1030', skyMid:'#1d2a6a', skyBot:'#4a4a96', mtnFar:'#2a3270', mtnNear:'#1d2558', tree:'#18304a', lakeTop:'#2a3a82', lakeBot:'#0d1442', grassA:'#2e6a4a', grassB:'#143a30', leaf:'#3a7a56', leafD:'#1d4a3a', leafL:'#5a9a72', trunk:'#30243a', cloud:'#4a5090', tint:'#1a1f5a', sunC:'#dfe0ff', sand:'#6a6a8a', island:'#2a6a4a', wood:'#4a3030', brick:'#6a5058', mortar:'#40303a',
           shade:.26, tintOp:.2, sunX:612, sunY:190, sunR:26, sunOp:0, glow:0, stars:1, moon:1, lamp:1, fly:1 }
};
var CK = ['skyTop','skyMid','skyBot','mtnFar','mtnNear','tree','lakeTop','lakeBot','grassA','grassB','leaf','leafD','leafL','trunk','cloud','tint','sunC','sand','island','wood','brick','mortar'];
var NK = ['shade','tintOp','sunX','sunY','sunR','sunOp','glow','stars','moon','lamp','fly'];

function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function mix(a, b, t) {
  var A = hex2rgb(a), B = hex2rgb(b);
  return '#' + A.map(function (v, i) { return Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0'); }).join('');
}
var state = { fly: 0, wind: .35, petals: true, flies: true };
var cur = Object.assign({}, THEMES.senja);
var elSun = $('#sun'), elGlow = $('#sunGlow'), elMoon = $('#moon'), elStars = $('#stars'),
    elGlitter = $('#glitter'), elShade = $('#shade'), elGlows = $('#glows');

function apply(v) {
  var s = document.documentElement.style;
  CK.forEach(function (k) { s.setProperty('--' + k, v[k]); });
  s.setProperty('--lampOp', v.lamp);
  elSun.setAttribute('cx', v.sunX); elSun.setAttribute('cy', v.sunY); elSun.setAttribute('r', v.sunR);
  elSun.setAttribute('opacity', v.sunOp);
  elGlow.setAttribute('cx', v.sunX); elGlow.setAttribute('cy', v.sunY); elGlow.setAttribute('opacity', v.glow);
  elMoon.setAttribute('transform', 'translate(' + v.sunX + ' ' + v.sunY + ')'); elMoon.setAttribute('opacity', v.moon);
  elStars.setAttribute('opacity', v.stars);

  elShade.setAttribute('opacity', v.shade + v.tintOp);
  elGlows.setAttribute('opacity', v.lamp);
  state.fly = v.fly;
}
var tw = 0;
function setTime(name, instant) {
  var to = THEMES[name], from = Object.assign({}, cur);
  cancelAnimationFrame(tw);
  if (instant || reduce) { cur = Object.assign({}, to); apply(cur); return; }
  var t0 = performance.now(), D = 1800;
  (function step(now) {
    var p = Math.min(1, (now - t0) / D), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    CK.forEach(function (k) { cur[k] = mix(from[k], to[k], e); });
    NK.forEach(function (k) { cur[k] = from[k] + (to[k] - from[k]) * e; });
    apply(cur);
    if (p < 1) tw = requestAnimationFrame(step);
  })(t0);
}

/* ---------------- static scenery ---------------- */
(function scenery() {
  var h = '', i;
  for (i = 0; i < 70; i++) h += '<circle class="star" cx="' + f(rr(-60, 1260)) + '" cy="' + f(rr(-40, 380)) + '" r="' + f(rr(.7, 1.9)) + '" style="animation-delay:' + f(-rr(0, 3)) + 's"/>';
  $('#stars').innerHTML = h;

  h = '';
  [[120,110,1],[470,70,.8],[760,140,1.15],[1020,84,.9],[330,200,.7]].forEach(function (c) {
    h += '<g transform="translate(' + c[0] + ' ' + c[1] + ') scale(' + c[2] + ')"><ellipse class="cloud" cx="0" cy="0" rx="70" ry="14"/><ellipse class="cloud" cx="-26" cy="-10" rx="34" ry="13"/><ellipse class="cloud" cx="22" cy="-14" rx="40" ry="16"/></g>';
  });
  $('#clouds').innerHTML = h;

  h = '';
  for (i = 0; i < 70; i++) h += '<circle class="cTree" cx="' + f(-60 + i * 19.5 + rr(-6, 6)) + '" cy="' + f(rr(438, 452)) + '" r="' + f(rr(9, 22)) + '"/>';
  $('#farTrees').innerHTML = h;

  h = '';
  var cols = ['#e23a3a', '#f06fa0', '#ffc83d', '#9b59d6', '#ffffff', '#ff8a3d'];
  for (i = 0; i < 16; i++) h += '<circle class="cTree" cx="' + f(rr(40, 470)) + '" cy="' + f(rr(468, 480)) + '" r="' + f(rr(8, 14)) + '"/>';
  for (var row = 0; row < 4; row++) {
    for (var x = 50 + row * 4; x < 455 - row * 4; x += 6.5 + row * .6) {
      var c = cols[Math.floor((x + row * 13) / 62) % cols.length];
      h += '<circle cx="' + f(x) + '" cy="' + f(484 + row * 5.6) + '" r="' + f(2 + row * .3) + '" fill="' + c + '"/>';
    }
  }


  h = '';
  for (i = 0; i < 26; i++) h += '<ellipse class="shim" cx="' + f(rr(-40, 1240)) + '" cy="' + f(rr(462, 556)) + '" rx="' + f(rr(10, 36)) + '" ry="1.4" style="animation-delay:' + f(-rr(0, 5)) + 's;animation-duration:' + f(rr(3.5, 7)) + 's"/>';
  $('#shimmer').innerHTML = h;
  h = '';
  for (i = 0; i < 16; i++) { var y = 458 + i * 6.4; h += '<ellipse class="gl" cx="' + f(rr(-8, 8)) + '" cy="' + f(y) + '" rx="' + f(6 + i * 2.6) + '" ry="1.6" style="animation-delay:' + f(-rr(0, 3)) + 's"/>'; }
  elGlitter.innerHTML = h;

  function canopy(id, cx, cy, rx, ry, n, bx, by) {
    var pad = 90, W = 2 * rx + pad * 2, H = 2 * ry + pad * 2, ox = cx - rx - pad, oy = cy - ry - pad, K = 2;
    var cv = document.createElement('canvas'); cv.width = W * K; cv.height = H * K;
    var c = cv.getContext('2d'); c.scale(K, K); c.translate(-ox, -oy);
    function pt(k, ext) { var a = R() * TAU, d = Math.pow(R(), k) * (ext || 1); return [cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d * (Math.sin(a) > 0 ? .82 : 1)]; }
    function dot(x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
    function shade(y, jit) { // 0 = light (top) .. 1 = dark (bottom)
      return Math.max(0, Math.min(1, (y - (cy - ry)) / (ry * 1.9) + (R() - .5) * jit));
    }
    function pink(t, a) { // lerp white-pink -> deep pink
      var A = [255, 238, 244], B = [247, 170, 198], C = [214, 96, 140], u, r, g, b2;
      if (t < .5) { u = t / .5; r = A[0] + (B[0] - A[0]) * u; g = A[1] + (B[1] - A[1]) * u; b2 = A[2] + (B[2] - A[2]) * u; }
      else { u = (t - .5) / .5; r = B[0] + (C[0] - B[0]) * u; g = B[1] + (C[1] - B[1]) * u; b2 = B[2] + (C[2] - B[2]) * u; }
      return 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + (b2 | 0) + ',' + (a == null ? 1 : a) + ')';
    }
    var j, p;
    // 1. deep base masses
    for (j = 0; j < 80; j++) { p = pt(.6, .85); dot(p[0], p[1], rr(20, 40), pink(.72 + R() * .2)); }
    // 2. branches inside the canopy
    c.strokeStyle = '#43262a'; c.lineCap = 'round';
    for (j = 0; j < 16; j++) {
      p = pt(.5, .85); var mx = (bx + p[0]) / 2 + rr(-30, 30), my = (by + p[1]) / 2 + rr(-24, 24);
      c.lineWidth = rr(2, 6); c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(mx, my, p[0], p[1]); c.stroke();
      c.lineWidth = 1.6; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[0] + rr(-22, 22), p[1] + rr(-20, 4)); c.stroke();
    }
    // 3. blossom clumps, lighter toward the top
    for (j = 0; j < 320; j++) { p = pt(.55, 1); dot(p[0], p[1], rr(9, 22), pink(shade(p[1], .35) * .85, .92)); }
    // 4. thousands of tiny blossoms for texture
    for (j = 0; j < 6200; j++) { p = pt(.5, 1.04); dot(p[0], p[1], rr(1.1, 2.8), pink(shade(p[1], .7))); }
    // 5. bright highlights on the upper side
    for (j = 0; j < 1400; j++) { p = pt(.5, 1); if (p[1] < cy + ry * .2) dot(p[0], p[1], rr(1, 2.2), 'rgba(255,250,252,' + rr(.6, 1).toFixed(2) + ')'); }
    // 6. little open five-petal flowers
    for (j = 0; j < 160; j++) {
      p = pt(.5, 1); var s2 = rr(2.2, 3.6), ro = R() * TAU; c.fillStyle = 'rgba(255,246,250,.95)';
      for (var k = 0; k < 5; k++) { var aa = ro + k * TAU / 5; c.beginPath(); c.ellipse(p[0] + Math.cos(aa) * s2, p[1] + Math.sin(aa) * s2, s2 * .75, s2 * .5, aa, 0, TAU); c.fill(); }
      dot(p[0], p[1], s2 * .4, '#e0567f');
    }
    // 7. loose petals at the edge
    for (j = 0; j < 260; j++) { p = pt(.25, 1.12); dot(p[0], p[1], rr(1, 2.2), pink(R() * .6)); }
    $(id).innerHTML = '<image x="' + ox + '" y="' + oy + '" width="' + W + '" height="' + H + '" href="' + cv.toDataURL('image/png') + '"/>';
  }

  canopy('#canopyL', 250, 70, 330, 165, 0, 360, 90);
  canopy('#canopyR', 975, 80, 300, 155, 0, 850, 100);
})();

/* ---------------- brick path ---------------- */
function pcx(y) { return 600 - (y - 620) * .3 + Math.sin((y - 620) / 38) * 7; }
function phw(y) { return 34 + (y - 620) * .5; }
(function brickPath() {
  var base = 'M', L = '', Rr = [], y;
  for (y = 612; y <= 850; y += 8) { L += (L ? ' L' : '') + f(pcx(y) - phw(y)) + ' ' + y; Rr.unshift(f(pcx(y) + phw(y)) + ' ' + y); }
  var h = '<path d="M' + L + ' L' + Rr.join(' L') + 'Z" style="fill:var(--brick)"/>';
  var yy = 612, row = 0, shades = ['rgba(255,235,210,.12)', 'rgba(0,0,0,.09)', 'rgba(255,255,255,.04)', 'rgba(70,30,10,.1)'];
  var rn = rng(77);
  while (yy < 850) {
    var hh = 7 + (yy - 612) * .055, y1 = yy + hh, n = 7, off = row % 2 ? .5 : 0;
    for (var j = -1; j < n; j++) {
      var t0 = Math.max(0, (j + off) / n), t1 = Math.min(1, (j + off + 1) / n);
      if (t1 - t0 < .04) continue;
      var xa = function (yv, t) { return pcx(yv) - phw(yv) + 2 * phw(yv) * t; };
      h += '<polygon class="br" fill="' + shades[Math.floor(rn() * shades.length)] + '" points="' + f(xa(yy, t0)) + ',' + f(yy) + ' ' + f(xa(yy, t1)) + ',' + f(yy) + ' ' + f(xa(y1, t1)) + ',' + f(y1) + ' ' + f(xa(y1, t0)) + ',' + f(y1) + '"/>';
    }
    yy = y1; row++;
  }
  var eL = '', eR = '';
  for (y = 612; y <= 850; y += 8) { eL += (eL ? ' L' : 'M') + f(pcx(y) - phw(y)) + ' ' + y; eR += (eR ? ' L' : 'M') + f(pcx(y) + phw(y)) + ' ' + y; }
  h += '<path d="' + eL + '" style="stroke:var(--sand)" stroke-width="5" fill="none" opacity=".85"/><path d="' + eR + '" style="stroke:var(--sand)" stroke-width="5" fill="none" opacity=".85"/>';
  /* jalan bata dihapus: area ini ditanami bunga */
})();

/* ---------------- flowers ---------------- */
var TUL = [['#e8559a','#ffd1e6'], ['#f06fa0','#fff0f6'], ['#f7a3c2','#ffffff'], ['#c93a8d','#f7a8d0'], ['#e23a3a','#ff9a8f'], ['#ff8a3d','#ffd08a'], ['#ffc83d','#fff0a0'], ['#8d54d6','#d7b8ff']];
var TULW = [0,0,0,1,1,1,2,2,3,3,4,5,6,7];
var LIL = [['#ffffff','#f39ac0'], ['#ffd3e3','#e8559a'], ['#ffc08a','#e8702a'], ['#fff3b8','#f2b830']];
var HYA = [['#5b6fe0','#9fb0ff'], ['#7a4fc4','#c5a6f0'], ['#a78bfa','#e0d4ff'], ['#4a5fd0','#8aa0ff']];

function wrap(x, y, s, inner, r) {

}
var FL = {

      '<g transform="translate(' + f(l) + ' ' + f(-h) + ')"><path d="M-9 2C-12 -11 -6 -19 -1 -23C0 -13 -1 -5 -4 3Z" fill="' + pal[0] + '"/><path d="M9 2C12 -11 6 -19 1 -23C0 -13 1 -5 4 3Z" fill="' + pal[0] + '"/>' +

      '<path class="lf" d="M0 -2C-11 -10 -17 -26 -15 -40C-6 -28 -2 -14 0 -2Z"/><path class="lf2" d="M0 -2C10 -9 15 -22 13 -33C6 -23 2 -12 0 -2Z"/>';

  lily: function (x, y, s, pal, r) {

    i = '<path class="stem" d="M0 0C' + f(l * .3) + ' ' + f(-h * .4) + ' ' + f(l) + ' ' + f(-h * .7) + ' ' + f(l) + ' ' + f(-h) + '"/>' +

      '<path class="lbud" d="M0 2C-4 -2 -4.5 -10 0 -17C4.5 -10 4 -2 0 2Z" fill="#cfe6a8" stroke="' + pal[0] + '" stroke-width="1"/>';
    for (var k = 0; k < 6; k++) {
      var back = k === 1 || k === 4;
      i += '<path class="lp" style="--a:' + ang[k] + 'deg' + (back ? ';opacity:.85' : '') + '" d="M0 1C-4.6 -3 -5.4 -10 0 -16.5C5.4 -10 4.6 -3 0 1Z" fill="' + pal[0] + '" stroke="' + pal[1] + '" stroke-width=".7"/>';

$('#tPetal').addEventListener('click', function () { state.petals = !state.petals; this.setAttribute('aria-pressed', state.petals); });
$('#tFly').addEventListener('click', function () { state.flies = !state.flies; this.setAttribute('aria-pressed', state.flies); });
(function menu() {
  var d = $('#dock'), b = $('#fab');
  function open(o) { d.hidden = !o; b.setAttribute('aria-expanded', o ? 'true' : 'false'); b.textContent = o ? 'Tutup' : 'Menu taman'; }
  b.addEventListener('click', function () { open(d.hidden); });
  document.addEventListener('pointerdown', function (e) {
    if (!d.hidden && !d.contains(e.target) && !b.contains(e.target)) {
      open(false); swallowClick = true; setTimeout(function () { swallowClick = false; }, 450);
    }
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !d.hidden) open(false); });
})();

setTime('senja', true);
if (!reduce) requestAnimationFrame(frame);
})();
</script>
